name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries for the PDF/image dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpq-dev pkg-config
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Unit tests (no database needed)
        working-directory: backend
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_security_tier0.py
          tests/test_security_tier0_followup.py
          tests/test_db_tier1.py
          tests/test_backend_tier1.py
          tests/test_email_flows.py
          tests/test_summaries.py
          tests/test_notifications.py
          tests/test_transactions.py
          tests/test_project_roles.py
          tests/test_time_and_custom_fields.py
          tests/test_bulk_and_notifications.py
          tests/test_automations.py
          tests/test_recurrence_ics.py
          tests/test_registration_approval.py
          tests/test_cpm.py
          tests/test_file_hub.py
          tests/test_mcp_registry.py
          tests/test_mcp_tokens.py
          tests/test_whiteboard_rooms.py
          tests/test_whiteboard_previews.py
          tests/test_activity.py
      - name: Generated guide sections are up to date
        run: python scripts/docs/gen_reference.py --check
      - name: Dependencies have no known vulnerabilities
        continue-on-error: true   # advisory for now; flip to blocking once the baseline is clean
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Podman stack + live checks
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install podman-compose
        run: pip install 'podman-compose>=1.2'
      - name: Generate a throw-away environment
        run: |
          cat > ci.env <<EOF
          POSTGRES_USER=monolith_user
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=monolith_db
          SECRET_KEY=$(openssl rand -hex 32)
          FIRST_SUPERUSER_EMAIL=admin@example.com
          FIRST_SUPERUSER_PASSWORD=$(openssl rand -hex 12)
          ALLOW_SIGNUP=false
          HTTP_PORT=8080
          APP_BASE_URL=http://localhost:8080
          MAIL_DOMAIN=monolith.local
          SMTP_USER=noreply@monolith.local
          SMTP_PASSWORD=$(openssl rand -hex 12)
          SMTP_STARTTLS=true
          SMTP_VERIFY_TLS=false
          EMAILS_FROM_EMAIL=noreply@monolith.local
          EOF
      - name: Prepare mail server (certificate + mailbox)
        run: ENV_FILE=ci.env bash scripts/mail-bootstrap.sh
      - name: Build and start
        run: |
          podman-compose --env-file ci.env -f compose.yaml up -d --build
          for i in $(seq 1 60); do
            [ "$(podman inspect -f '{{.State.Health.Status}}' monolith_backend 2>/dev/null)" = healthy ] && exit 0
            sleep 5
          done
          podman ps -a; podman logs monolith_backend || true
          exit 1
      - name: Live checks (fresh database)
        run: bash scripts/live-smoke.sh
      - name: Show logs on failure
        if: failure()
        run: |
          podman ps -a
          for c in monolith_backend monolith_proxy monolith_mail monolith_db; do echo "=== $c ==="; podman logs --tail 80 $c || true; done
