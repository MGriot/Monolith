# Edge proxy: one origin for SPA + API + websockets.
# Upstream names resolve through the compose network DNS at start-up;
# compose `depends_on` (service_healthy) guarantees they exist first.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 100M;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }

    # API, including the notification websocket (/api/v1/notifications/ws/...)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # MCP SSE (long-lived, unbuffered). Backend must authenticate this route.
    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }
}
