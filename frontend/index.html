<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/monolith.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monolith Planner</title>
    <script id="theme-init">
      // Set the theme class before first paint (no light flash). Keep in step with src/lib/theme.ts (tested there).
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('monolith-theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark'); else root.classList.remove('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <script>
      // Required for @excalidraw/excalidraw
      // Point to the dedicated assets folder in public
      window.EXCALIDRAW_ASSET_PATH = "/excalidraw-assets/";
      // Excalidraw expects process.env.NODE_ENV to be defined in some environments
      window.process = { env: { NODE_ENV: 'production' } };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
